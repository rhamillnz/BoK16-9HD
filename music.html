<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Krondor Music Browser</title>
    <style>
      :root {
        --bg: #17130e;
        --panel: #221c14;
        --line: #3a3024;
        --text: #eadfc8;
        --muted: #a8977a;
        --accent: #d9a441;
        --dialogue: #7fb0d8;
        --cutscene: #c98bd1;
        --fixed: #9ccc7a;
        --remake: #d9a441;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.45 system-ui,
          sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 2;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        padding: 12px 16px;
      }
      h1 {
        margin: 0 0 8px;
        font:
          600 20px Georgia,
          serif;
        color: var(--accent);
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        align-items: center;
      }
      .bar label {
        color: var(--muted);
      }
      select,
      input[type='search'] {
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 4px 6px;
      }
      #now {
        flex: 1 1 320px;
        display: flex;
        gap: 8px;
        align-items: center;
        min-width: 0;
      }
      #now span {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      audio {
        height: 32px;
        flex: 1;
        min-width: 180px;
      }
      main {
        padding: 12px 16px 48px;
        max-width: 1200px;
        margin: 0 auto;
      }
      .track {
        display: grid;
        grid-template-columns: 124px 1fr minmax(220px, 34%);
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }
      .track.playing {
        background: #2b2216;
      }
      .id {
        font:
          600 22px Georgia,
          serif;
      }
      .id .name {
        color: var(--accent);
        font:
          600 13px ui-monospace,
          monospace;
      }
      .id small {
        display: block;
        font: 12px system-ui;
        color: var(--muted);
      }
      .btns {
        display: flex;
        gap: 6px;
        margin-top: 6px;
        flex-wrap: wrap;
      }
      button {
        background: #3a2e1e;
        color: var(--text);
        border: 1px solid #5a4730;
        border-radius: 4px;
        padding: 3px 8px;
        cursor: pointer;
        font: inherit;
        font-size: 12px;
      }
      button:hover {
        border-color: var(--accent);
      }
      .uses {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .uses li {
        margin: 2px 0;
      }
      .tag {
        display: inline-block;
        min-width: 72px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .dialogue {
        color: var(--dialogue);
      }
      .cutscene {
        color: var(--cutscene);
      }
      .fixed,
      .scene {
        color: var(--fixed);
      }
      .remake {
        color: var(--remake);
      }
      .unused {
        color: var(--muted);
        font-style: italic;
      }
      details summary {
        cursor: pointer;
        color: var(--dialogue);
      }
      details li {
        color: var(--muted);
        font-size: 13px;
      }
      textarea {
        width: 100%;
        min-height: 64px;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 6px;
        font: inherit;
        resize: vertical;
      }
      .saved {
        font-size: 11px;
        color: var(--muted);
        height: 14px;
      }
      #status {
        color: var(--muted);
      }
      @media (max-width: 720px) {
        .track {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Krondor music browser</h1>
      <div class="bar">
        <label
          >Show
          <select id="filter">
            <option value="all">all tracks</option>
            <option value="dialogue">used in dialogue</option>
            <option value="cutscene">used in cutscenes</option>
            <option value="unused">not used by the original</option>
            <option value="noted">with my notes</option>
          </select></label
        >
        <input id="search" type="search" placeholder="Search uses and notes" />
        <div id="now"><span id="nowLabel">Nothing playing</span><audio id="player" controls></audio></div>
      </div>
      <div id="status">Reading the game data…</div>
    </header>
    <main id="list"></main>
    <script type="module" src="/src/music/main.ts"></script>
  </body>
</html>
